[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polyorderbooks"
version = "0.2.0"
description = "Official Python SDK for the PolyOrderbooks historical Polymarket data API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "PolyOrderbooks", email = "contact@polyorderbooks.com" }]
keywords = ["polymarket", "order-book", "prediction-markets", "api"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27.0,<1.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-httpx>=0.35.0"]

[project.urls]
Homepage = "https://polyorderbooks.com"
Documentation = "https://docs.polyorderbooks.com"
Repository = "https://github.com/polyorderbookslabs/polyorderbooks-python"
Issues = "https://github.com/polyorderbookslabs/polyorderbooks-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/polyorderbooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
